<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliphook — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #09090b; color: #fafafa; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        select option { background: #18181b; color: #fafafa; }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center px-4">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5 mb-10">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-cyan-500 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
                </svg>
            </div>
            <span class="text-xl font-bold text-white tracking-tight">clip<span class="text-violet-400">hook</span></span>
        </a>

        <!-- Card -->
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <h1 id="authTitle" class="text-2xl font-bold text-white mb-2">Welcome back</h1>
                <p id="authSubtitle" class="text-sm text-zinc-500">Sign in to your account to continue</p>
            </div>

            <!-- Error message -->
            <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-400"></div>

            <!-- Google OAuth -->
            <a href="/auth/google" class="flex items-center justify-center gap-3 w-full px-5 py-3 rounded-xl bg-white text-zinc-900 font-semibold text-sm hover:bg-zinc-100 transition-colors mb-6">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>

            <!-- Divider -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-xs text-zinc-600 uppercase tracking-wider">or</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Email / Password form -->
            <form id="authForm" class="space-y-3" onsubmit="return handleSubmit(event)">
                <!-- Name (register only) -->
                <div id="nameField" class="hidden">
                    <input id="nameInput" type="text" placeholder="Full name"
                        class="w-full px-4 py-3 rounded-xl bg-white/[0.03] border border-white/10 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500/50 transition-colors">
                </div>
                <input id="emailInput" type="email" placeholder="Email address" required
                    class="w-full px-4 py-3 rounded-xl bg-white/[0.03] border border-white/10 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500/50 transition-colors">
                <input id="passwordInput" type="password" placeholder="Password" required minlength="8"
                    class="w-full px-4 py-3 rounded-xl bg-white/[0.03] border border-white/10 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500/50 transition-colors">
                <button id="submitBtn" type="submit"
                    class="w-full px-5 py-3 rounded-xl bg-violet-600 text-white font-semibold text-sm hover:bg-violet-500 transition-colors cursor-pointer">
                    Sign in
                </button>
            </form>

            <!-- Toggle login/register -->
            <p class="text-center text-sm text-zinc-500 mt-5">
                <span id="toggleText">Don't have an account?</span>
                <button id="toggleBtn" class="text-violet-400 hover:text-violet-300 font-medium cursor-pointer ml-1" onclick="toggleMode()">Sign up</button>
            </p>

        </div>
    </div>

    <script>
    let isRegister = false;

    // Check for OAuth error in URL
    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
        const msgs = { oauth_denied: 'Google sign-in was cancelled.', oauth_failed: 'Google sign-in failed. Please try again.' };
        showError(msgs[params.get('error')] || 'Authentication failed.');
    }

    function toggleMode() {
        isRegister = !isRegister;
        document.getElementById('authTitle').textContent = isRegister ? 'Create an account' : 'Welcome back';
        document.getElementById('authSubtitle').textContent = isRegister ? 'Get started with Cliphook for free' : 'Sign in to your account to continue';
        document.getElementById('nameField').classList.toggle('hidden', !isRegister);
        document.getElementById('submitBtn').textContent = isRegister ? 'Create account' : 'Sign in';
        document.getElementById('toggleText').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
        document.getElementById('toggleBtn').textContent = isRegister ? 'Sign in' : 'Sign up';
        hideError();
    }

    async function handleSubmit(e) {
        e.preventDefault();
        hideError();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = isRegister ? 'Creating...' : 'Signing in...';

        const fd = new FormData();
        fd.append('email', document.getElementById('emailInput').value);
        fd.append('password', document.getElementById('passwordInput').value);
        if (isRegister) fd.append('name', document.getElementById('nameInput').value);

        try {
            const resp = await fetch(isRegister ? '/auth/register' : '/auth/login', { method: 'POST', body: fd });
            const data = await resp.json();
            if (!resp.ok) { showError(data.error || 'Something went wrong.'); return; }
            window.location.href = data.redirect || '/app';
        } catch (err) {
            showError('Network error. Please try again.');
        } finally {
            btn.disabled = false;
            btn.textContent = isRegister ? 'Create account' : 'Sign in';
        }
        return false;
    }

    function showError(msg) { const el = document.getElementById('errorBox'); el.textContent = msg; el.classList.remove('hidden'); }
    function hideError() { document.getElementById('errorBox').classList.add('hidden'); }
    </script>
</body>
</html>
